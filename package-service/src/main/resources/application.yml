spring:
  application:
    name: package-service

  datasource:
    url: jdbc:postgresql://localhost:5432/package_service
    username: package_service
    password: package_service
  jpa:
    hibernate:
      ddl-auto: update # trocaremos por Flyway no Bloco 4 do roteiro
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.travelplatform: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://localhost:5432/package_service_test
